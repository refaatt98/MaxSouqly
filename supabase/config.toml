# Supabase CLI configuration for MAX (local development).
project_id = "max-restaurant"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Staff accounts are created by the owner (create-employee-user); no public sign-up.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[functions.pin-login]
verify_jwt = false

[functions.create-employee-user]
verify_jwt = false
