<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>MAX Management</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #131110; color: #f3eee6; font-family: system-ui, 'Segoe UI', Tahoma, sans-serif; display: grid; place-items: center; text-align: center; }
  .mark { font-size: 40px; font-weight: 800; letter-spacing: 1px; }
  .mark b { color: #e11d2e; margin-inline-end: 6px; }
  p { color: #bdb4a7; margin: 8px 0; }
  button { margin-top: 18px; background: #e11d2e; color: #fff; border: 0; border-radius: 10px; padding: 12px 26px; font-size: 16px; cursor: pointer; }
  small { display: block; margin-top: 14px; color: #8f8679; }
</style>
</head>
<body>
  <div>
    <div class="mark"><b>/</b>MAX</div>
    <p>لا يوجد اتصال بالإنترنت</p>
    <p>אין חיבור לאינטרנט</p>
    <button id="retry">إعادة المحاولة · נסה שוב</button>
    <small id="status">ستتم إعادة المحاولة تلقائياً…</small>
  </div>
  <script>
    const to = new URLSearchParams(location.search).get('to') || 'https://maxsouqly.netlify.app';
    const go = () => { location.href = to; };
    document.getElementById('retry').addEventListener('click', go);
    window.addEventListener('online', go);
    setInterval(() => { if (navigator.onLine) go(); }, 10000);
  </script>
</body>
</html>
