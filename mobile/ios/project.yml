name: MaxManagement
options:
  bundleIdPrefix: com.souqly
  deploymentTarget:
    iOS: "15.0"
targets:
  MaxManagement:
    type: application
    platform: iOS
    sources:
      - MaxManagement
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souqly.maxmanagement
        PRODUCT_NAME: MaxManagement
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MaxManagement/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: MaxManagement/Info.plist
      properties:
        CFBundleDisplayName: MAX Management
        CFBundleName: MAX Management
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ar
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarHidden: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "لالتقاط صور الأصناف · לצילום תמונות של פריטים"
        NSPhotoLibraryUsageDescription: "لاختيار صور الأصناف · לבחירת תמונות של פריטים"
        NSPhotoLibraryAddUsageDescription: "لحفظ الملفات المصدّرة · לשמירת קבצים"
        ITSAppUsesNonExemptEncryption: false
