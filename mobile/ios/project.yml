name: MaxManagement
options:
  bundleIdPrefix: com.souqly
  deploymentTarget:
    iOS: "15.0"
targets:
  MaxManagement:
    type: application
    platform: iOS
    sources:
      - MaxManagement
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souqly.maxmanagement
        PRODUCT_NAME: MaxManagement
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MaxManagement/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: MaxManagement/Info.plist
      properties:
        CFBundleDisplayName: Max Restaurant
        CFBundleName: Max Restaurant
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarHidden: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleLocalizations: [ar, he]
        # one language per message: Arabic here, Hebrew in he.lproj/InfoPlist.strings
        NSCameraUsageDescription: "يستخدم التطبيق الكاميرا لتصوير أطباق القائمة عند إضافتها أو تعديلها."
        NSPhotoLibraryUsageDescription: "يستخدم التطبيق الصور لاختيار صورة طبق في القائمة."
        NSPhotoLibraryAddUsageDescription: "يحفظ التطبيق الملفات التي تصدّرها، مثل تقارير Excel."
        ITSAppUsesNonExemptEncryption: false
