plugins { id 'com.android.application' }

android {
    namespace 'com.souqly.maxmanagement'
    compileSdk 34
    defaultConfig {
        applicationId 'com.souqly.maxmanagement'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so it installs straight away (no store keystore here)
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
