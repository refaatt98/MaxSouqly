plugins { id 'com.android.application' }

// Play Store upload key: read from a keystore.properties file that is never committed
// (storeFile, storePassword, keyAlias, keyPassword). Without it the build is signed with the debug key.
def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'com.souqly.maxmanagement'
    compileSdk 36
    defaultConfig {
        applicationId 'com.souqly.maxmanagement'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        if (keyFile.exists()) {
            upload {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile.exists() ? signingConfigs.upload : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
